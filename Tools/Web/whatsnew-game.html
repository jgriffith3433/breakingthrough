<!-- hawkes-whatsnew: written by breakingthrough's WebGL deploy (Tools/Web/whatsnew-game.html); edit it there, not here -->
<style>
  #version-display a {
    color: inherit;
    text-decoration: none;
  }
  #version-display a:hover,
  #version-display a:focus-visible {
    color: #e7d3b0;
  }
</style>
<script src="../js/hawkes-release.js" data-releases="../releases.json"></script>
<script>
  // The release (releases.json) and the build running, as a link to What's new. The corner shows only "build 121"
  // (two words: first-five counts every distinct line on the page in a stranger's first minute); the version and
  // "What's new" ride in the link's aria-label and title. It opens in a new tab, so a tap never ends a run.
  (function () {
    var box = document.getElementById("version-display");
    if (!box) return;
    var build = String(window.PLACE_BUILD || window.GAME_BUILD || "").replace(/^v/, "");
    var link = document.createElement("a");
    link.href = "../whatsnew.html";
    link.target = "_blank";
    link.rel = "noopener";
    link.setAttribute("data-hawkes-whatsnew", "");
    link.textContent = build ? "build " + build : "";
    function name(version) {
      var label = (version ? "v" + version + " · " : "") + (build ? "build " + build + " · " : "") + "What's new";
      link.setAttribute("aria-label", label);
      link.title = label;
    }
    name("");
    box.textContent = "";
    box.appendChild(link);
    if (window.hawkesRelease) window.hawkesRelease.then(function (r) {
      var top = r && r.releases && r.releases[0];
      if (top) name(top.version);
    });
  })();
</script>
<!-- /hawkes-whatsnew -->
